name: Tests

# The suite and the formatting check on every supported Python, with the versions constraints.txt pins. No dataset is
# needed: the tests run on synthetic data, and the one test that needs SecretBench skips without DSBENCH_DATA.

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --constraint constraints.txt --editable '.[dev]'

      - name: Formatting
        run: black --check .

      - name: Tests
        run: python -m pytest -q
